# 接入 opencode 所在 compose 的片段（合并进宿主机 compose 文件）。
# 注意 networks 名称请替换为 opencode 容器实际所在的 compose 网络名。
services:
  mcp-gateway:
    image: mcp-gateway:latest
    build: ./mcp-gateway
    container_name: mcp-gateway
    restart: unless-stopped
    volumes:
      # 需要使用管理控制台（/）保存配置时，去掉 :ro 改为可写挂载；
      # 仅作为网关运行（配置手工编辑 + SIGHUP/热更新）可保持只读。
      - ./mcp-gateway/gateway.json:/etc/mcp-gateway/gateway.json
    networks: [opencode]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9200/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # 确需从宿主机/局域网浏览器访问网关或管理控制台时，再打开 ports 并绑定
    # 宿主机具体 IP、配合防火墙限源；务必先启用 auth.tokens 与 console.tokens。
    # ports:
    #   - "192.168.31.10:9200:9200"

# opencode 服务需追加（保证目录初始化时网关已就绪，避免空目录窗口）：
#   opencode:
#     depends_on:
#       mcp-gateway:
#         condition: service_healthy

networks:
  opencode:
    external: true
