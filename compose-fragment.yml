# 接入 opencode 所在 compose 的片段（合并进宿主机 compose 文件）。
# 注意 networks 名称请替换为 opencode 容器实际所在的 compose 网络名。
services:
  mcp-gateway:
    image: mcp-gateway:latest
    build: ./mcp-gateway
    container_name: mcp-gateway
    restart: unless-stopped
    volumes:
      - ./mcp-gateway/gateway.json:/etc/mcp-gateway/gateway.json:ro
    networks: [opencode]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9200/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# opencode 服务需追加（保证目录初始化时网关已就绪，避免空目录窗口）：
#   opencode:
#     depends_on:
#       mcp-gateway:
#         condition: service_healthy

networks:
  opencode:
    external: true
