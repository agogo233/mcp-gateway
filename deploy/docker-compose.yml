# MCP 独立部署栈：故障隔离网关 + GitHub MCP
# 前提：OpenCodeUI 栈已启动（网络 opencode-net 已存在）。
# 用法：
#   cp ../gateway.json gwconfig/   # 配置拷入挂载目录（目录已在 .gitignore 忽略）
#   cp .env.example .env 并填入 GITHUB_PERSONAL_ACCESS_TOKEN
#   docker compose up -d --build
#
# 控制台：浏览器打开 http://<宿主机IP>:9200/ ，首次粘贴 console token
# （gateway.json 的 console.tokens，与下游 token 相互独立）。
#
# 说明：网关以 user: "0:0" 运行且配置按目录挂载——控制台保存/上游启停需要
# 在配置目录内做"临时文件+rename"原子写，单文件只读挂载无法支持。

services:
  mcp-gateway:
    build:
      context: ..
    # 网关镜像首次发布后可切换为：
    # image: ghcr.io/<owner>/mcp-gateway:latest
    image: mcp-gateway:local
    container_name: mcp-gateway
    restart: unless-stopped
    # 镜像默认 USER app（非 root）；宿主机 gateway.json 为 0600，控制台
    # 持久化（保存/启停写盘）需要写权限，故以 root 运行本容器。
    user: "0:0"
    # 加固：禁止提权并丢弃全部 Linux capabilities。配置目录为 root 属主的
    # bind mount，owner 写权限不依赖任何 capability；healthcheck 的 wget
    # 只需普通网络栈，均不受影响。
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      github-mcp:
        condition: service_healthy
    ports:
      # 控制台与 MCP 端点。默认仅宿主机本机；.env 里设 MCP_GATEWAY_ADDR=0.0.0.0
      # 可开放给局域网（/mcp/* 与 /api/* 均需各自 token，建议配合防火墙限源）。
      - "${MCP_GATEWAY_ADDR:-127.0.0.1}:9200:9200"
    volumes:
      - ./gwconfig:/etc/mcp-gateway
    networks:
      - opencode-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9200/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  github-mcp:
    image: ghcr.io/agogo233/go-github-mcp:latest
    container_name: github-mcp
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MCP_TRANSPORT: http
      HTTP_ADDR: 0.0.0.0:8080
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      AUTH_TOKEN: ${GITHUB_MCP_AUTH_TOKEN}
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-default}
      READ_ONLY: ${GITHUB_MCP_READ_ONLY:-false}
    networks:
      - opencode-net
    # 镜像自带 HEALTHCHECK(8080/healthz)

networks:
  opencode-net:
    external: true
    name: opencode-net
