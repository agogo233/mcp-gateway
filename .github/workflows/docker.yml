name: Docker

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build & Push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to commit SHAs of the referenced major-version tags
      # (supply-chain hardening; re-check on version bumps).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build image (load)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-gateway:ci
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # gateway.example.json enables auth with this literal token, and an
          # unauthenticated /healthz only answers liveness (no version field).
          docker run -d --name gw -v "$PWD/gateway.example.json:/etc/mcp-gateway/gateway.json:ro" -p 9200:9200 mcp-gateway:ci
          for i in $(seq 1 30); do
            if curl -sf -H "Authorization: Bearer <openssl-rand-hex-32>" http://127.0.0.1:9200/healthz | grep -q '"version"'; then
              curl -s -H "Authorization: Bearer <openssl-rand-hex-32>" http://127.0.0.1:9200/healthz
              exit 0
            fi
            sleep 1
          done
          docker logs gw
          exit 1

      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,mode=max

      - name: Show image size
        run: docker images mcp-gateway:ci --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  cleanup:
    name: Cleanup old runs & packages
    runs-on: ubuntu-latest
    needs: docker
    if: always() && github.event_name != 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: docker.yml
          retain_days: 30
          keep_minimum_runs: 10

      - name: Delete old untagged GHCR packages
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: mcp-gateway
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: true
